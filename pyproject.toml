[project]
name = "so100rob"
version = "0.1.0"
description = "SO-ARM100 RL robustness experiment: MuJoCo pick-and-place env, perturbation stack, and evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "mujoco==3.12.0",
    "gymnasium==1.3.0",
    "imageio==2.37.4",
    "numpy==2.5.2",
    "torch==2.14.0",
    "stable-baselines3==2.9.0",
    "tensorboard==2.21.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Wheel target: exists for dependency declaration, NOT deployment.
# so100rob/assets/scene_pickplace.xml includes the pinned upstream robot
# model via a repo-tree-relative path (trs_so_arm100/ at the repo root),
# which MuJoCo resolves relative to the XML file — from an installed copy
# that path points above site-packages and model compile fails. The package
# requires the repo tree (editable install) to construct the env.
[tool.hatch.build.targets.wheel]
packages = ["src/so100rob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
